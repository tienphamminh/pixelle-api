<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="576">
    <meta name="template:media-height" content="1024">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Fullscreen Vertical Video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /*
         * KEY INSIGHT: Pixelle-Video overlay ẢNH PNG này LÊN TRÊN video AI.
         * Vùng nào của PNG trong suốt → video AI hiện ra ở đó.
         * Vùng nào của PNG có màu → màu đó che video.
         * => Nền body phải TRONG SUỐT, không phải đen.
         */
        html, body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background: transparent;  /* TRONG SUỐT để video AI hiện ra */
        }

        body {
            font-family: 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei',
                         -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff;
            position: relative;
        }

        /* Gradient mờ ở đáy - bán trong suốt để vừa thấy video vừa làm nền cho chữ */
        .vignette {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 1080px;
            height: 520px;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.40) 50%,
                rgba(0, 0, 0, 0.75) 100%
            );
            z-index: 2;
            pointer-events: none;
        }

        /* Phụ đề voiceover */
        .content {
            position: absolute;
            bottom: 260px;
            left: 80px;
            width: 920px;
            z-index: 3;
            text-align: center;
        }

        .text {
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.4;
            letter-spacing: 1px;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0    6px 18px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>
    <!--
     * KHÔNG cần .video-overlay div nữa!
     * Video AI tự động được đặt làm BASE LAYER bởi ffmpeg.
     * Template HTML này chỉ render các thứ ĐÈ LÊN video (gradient + subtitle).
     * Vùng trong suốt = video AI hiện ra fullscreen.
    -->

    <!-- Gradient tối ở đáy -->
    <div class="vignette"></div>

    <!-- Phụ đề voiceover -->
    <div class="content">
        <div class="text">{{text}}</div>
    </div>
</body>
</html>
